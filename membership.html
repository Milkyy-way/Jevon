  <!-- INTERNAL CSS: Keeps the layout consistent with the courses page -->
  <style>
    .membership-main {
      padding-top: 140px;
      padding-bottom: 80px;
      background-color: #fdfdfd;
      min-height: 100vh;
    }

    .membership-header {
      text-align: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    .membership-header h1 {
      color: #17305b;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .membership-header p {
      color: #6c7a89;
      font-size: 1.1rem;
    }

    /* Description Box Styling */
    .membership-info {
      max-width: 800px;
      margin: 0 auto 50px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid #eaeaea;
      color: #333;
      line-height: 1.7;
    }

    .membership-info h2 {
      color: #17305b;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .membership-info p {
      margin-bottom: 15px;
      font-size: 1.05rem;
    }

    .membership-info ul {
      margin-left: 20px;
      margin-bottom: 20px;
    }

    .membership-info li {
      margin-bottom: 10px;
    }

    /* The Graphy Card Styling */
    .graphy-grid {
      display: grid;
      grid-template-columns: minmax(320px, 400px); /* Forces exactly one centered card */
      justify-content: center;
      padding: 0 20px;
    }

    .graphy-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      text-align: left;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .graphy-card:hover {
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
      transform: translateY(-4px);
    }

    .graphy-image {
      width: 100%;
      height: 220px;
      position: relative;
      background-color: #2c2c2c;
    }

    .graphy-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .share-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 6px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .share-icon svg {
      width: 16px;
      height: 16px;
      fill: #333;
    }

    .graphy-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .graphy-title {
      font-size: 1.3rem;
      color: #5b5fc7;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .graphy-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      font-size: 0.95rem;
      color: #777;
    }
    
    .graphy-meta strong {
      color: #5b5fc7;
      font-weight: 600;
    }
  </style>
</head>
