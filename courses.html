  <!-- INTERNAL CSS: This guarantees the course grid works without relying on style.css updates -->
  <style>
    .courses-main {
      padding-top: 140px;
      padding-bottom: 80px;
      background-color: #fdfdfd;
      min-height: 100vh;
      text-align: center;
    }

    .courses-header {
      margin-bottom: 50px;
    }

    .courses-header h1 {
      color: #17305b;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .courses-header p {
      color: #6c7a89;
      font-size: 1.1rem;
    }

    /* The Grid Layout */
    .graphy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 30px;
      max-width: 800px; /* Keeps it tight and centered for exactly 2 courses */
      margin: 0 auto;
      padding: 0 20px;
    }

    /* The Individual Card */
    .graphy-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      text-align: left;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .graphy-card:hover {
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
      transform: translateY(-4px);
    }

    /* The Image Wrapper - This strictly prevents giant images! */
    .graphy-image {
      width: 100%;
      height: 200px;
      position: relative;
      background-color: #2c2c2c;
    }

    .graphy-image img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Forces the image to fit perfectly in the box */
    }

    /* The Share Icon on Top Right */
    .share-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 6px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .share-icon svg {
      width: 16px;
      height: 16px;
      fill: #333;
    }

    /* The Text Content inside Card */
    .graphy-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .graphy-title {
      font-size: 1.2rem;
      color: #5b5fc7; /* The purplish blue from Graphy */
      margin-bottom: 25px;
      font-weight: 500;
    }

    /* The Bottom Meta Data (Enrolled Learners, etc) */
    .graphy-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      font-size: 0.9rem;
      color: #777;
    }
    
    .graphy-meta strong {
      color: #5b5fc7;
      font-weight: 600;
    }
  </style>
</head>
